# SPOT Proxy Networking Plugin

enabled: false

proxy:
  # Supported values:
  #   http
  #   https
  #   socks5
  #   socks5h
  type: socks5

  host: 127.0.0.1
  port: 8080

  # Require the proxy for network activity.
  strict: true

  # Deny activity when the proxy is unavailable.
  fail_closed: true

  # Keep this false.
  allow_direct_fallback: false

  # Authentication is disabled by default.
  authentication:
    enabled: false

    # Do not place real credentials in this configuration file.
    username: null
    password: null

  # Proxy chaining is intentionally unsupported.
  allow_proxy_chaining: false

network:
  # SPOT remains the authoritative network-policy layer.
  use_spot_network_policy: true

  require_approved_network: true

  # Never silently bypass the proxy.
  prevent_direct_fallback: true

  # DNS remains controlled by SPOT.
  prevent_dns_bypass: true

  # The plugin does not modify host routes.
  modify_host_routes: false

  # The plugin does not modify host firewalls.
  modify_firewall: false

health:
  enabled: true

  # A TCP connection only checks whether the proxy endpoint
  # is reachable. It does not make an Internet request.
  tcp_endpoint_check: true

  check_on_start: false

  interval_seconds: 60
  timeout_seconds: 5

logging:
  enabled: true

  # Do not log full proxy URLs unnecessarily.
  log_proxy_url: false

  # Never log proxy passwords.
  log_credentials: false

  redact_sensitive_values: true

safety:
  respect_emergency_stop: true
  respect_network_limits: true
  respect_bandwidth_limits: true
  respect_domain_allowlist: true
  respect_domain_blocklist: true
